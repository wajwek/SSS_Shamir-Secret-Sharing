[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shamir-sss-education"
version = "0.1.0"
description = "Edukacyjna implementacja Shamir Secret Sharing z planowaną integracją ECDSA P-256"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shamir", "shamir.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
